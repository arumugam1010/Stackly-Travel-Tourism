<!DOCTYPE html>
<html lang="en">
    <!--<< Header Area >>-->
    <head>
        <!-- ========== Meta Tags ========== -->
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Gramentheme">
        <meta name="description" content="Restin - Tours & Travels Agency - 404 Page Not Found">
        <!-- ======== Page title ============ -->
        <title>404 - Page Not Found | Restin Tours & Travels</title>
        <!--<< Favcion >>-->
        <link rel="shortcut icon" href="assets/img/favicon.svg">
        <!--<< Bootstrap min.css >>-->
        <link rel="stylesheet" href="assets/css/bootstrap.min.css">
        <!--<< All Min Css >>-->
        <link rel="stylesheet" href="assets/css/all.min.css">
        <!--<< Animate.css >>-->
        <link rel="stylesheet" href="assets/css/animate.css">
        <!--<< Magnific Popup.css >>-->
        <link rel="stylesheet" href="assets/css/magnific-popup.css">
        <!--<< MeanMenu.css >>-->
        <link rel="stylesheet" href="assets/css/meanmenu.css">
        <!--<< Swiper Bundle.css >>-->
        <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">
        <!--<< Nice Select.css >>-->
        <link rel="stylesheet" href="assets/css/nice-select.css">
        <!--<< Main.css >>-->
        <link rel="stylesheet" href="assets/css/main.css">
    </head>
    <body class="body-bg">

        <!-- Preloader Start -->
        <div id="preloader" class="preloader">
            <div class="animation-preloader">
                <div class="spinner">                
                </div>
                <div class="txt-loading">
                    <span data-text-preloader="R" class="letters-loading">
                        R
                    </span>
                    <span data-text-preloader="E" class="letters-loading">
                        E
                    </span>
                    <span data-text-preloader="S" class="letters-loading">
                        S
                    </span>
                    <span data-text-preloader="T" class="letters-loading">
                        T
                    </span>
                    <span data-text-preloader="I" class="letters-loading">
                        I
                    </span>
                    <span data-text-preloader="N" class="letters-loading">
                        N
                    </span>
                </div>
                <p class="text-center">Loading</p>
            </div>
            <div class="loader">
                <div class="row">
                    <div class="col-3 loader-section section-left">
                        <div class="bg"></div>
                    </div>
                    <div class="col-3 loader-section section-left">
                        <div class="bg"></div>
                    </div>
                    <div class="col-3 loader-section section-right">
                        <div class="bg"></div>
                    </div>
                    <div class="col-3 loader-section section-right">
                        <div class="bg"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 404 Error Section Start -->
        <section class="error-section d-flex align-items-center justify-content-center min-vh-100 py-4" style="background: radial-gradient(circle at center, #ffffff 0%, #fbf9f6 100%);">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-7 col-md-9">
                        <div class="error-items text-center">
                            <!-- Brand Logo -->
                            <div class="error-logo mb-3 wow fadeInUp" data-wow-delay=".2s">
                                <a href="index.html">
                                    <img src="assets/img/logo/stackly-black.webp" alt="Restin Tours & Travels" style="height: 42px;">
                                </a>
                            </div>

                            <!-- 404 Graphic Card -->
                            <div class="error-image wow fadeInUp" data-wow-delay=".3s" style="margin-bottom: 15px;">
                                <img src="assets/img/404.webp" alt="404 Page Not Found" style="max-width: 290px; margin: 0 auto; border-radius: 14px; box-shadow: 0 15px 35px rgba(0,0,0,0.07);">
                            </div>

                            
                            <div class="error-btn wow fadeInUp d-flex flex-wrap justify-content-center gap-3" data-wow-delay=".9s">
                                <a href="index.html" class="theme-btn style-3" style="padding: 14px 28px; font-size: 14px; letter-spacing: 0.5px;">
                                    <i class="fa-solid fa-house me-2"></i> RETURN TO HOME
                                </a>
                                <a href="dashboard.html" id="returnDashboardBtn" class="theme-btn" style="padding: 14px 28px; font-size: 14px; letter-spacing: 0.5px; background: var(--theme, #AA8453); color: #fff; border: 1.5px solid #AA8453;">
                                    <i class="fa-solid fa-gauge-high me-2"></i> <span id="returnDashboardText">RETURN TO DASHBOARD</span>
                                </a>
                            </div>

                            <div class="mt-4 text-muted wow fadeInUp" data-wow-delay="1.1s" style="font-size: 13px; opacity: 0.65;">
                                © 2026 Restin Tours & Travels. All Rights Reserved.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!--<< All JS Plugins >>-->
        <script src="assets/js/jquery-3.7.1.min.js"></script>
        <!--<< Viewport Js >>-->
        <script src="assets/js/viewport.jquery.js"></script>
        <!--<< Bootstrap Js >>-->
        <script src="assets/js/bootstrap.bundle.min.js"></script>
        <!--<< Nice Select Js >>-->
        <script src="assets/js/jquery.nice-select.min.js"></script>
        <!--<< Waypoints Js >>-->
        <script src="assets/js/jquery.waypoints.js"></script>
        <!--<< Counterup Js >>-->
        <script src="assets/js/jquery.counterup.min.js"></script>
        <!--<< Swiper Slider Js >>-->
        <script src="assets/js/swiper-bundle.min.js"></script>
        <!--<< MeanMenu Js >>-->
        <script src="assets/js/jquery.meanmenu.min.js"></script>
        <!--<< Magnific Popup Js >>-->
        <script src="assets/js/jquery.magnific-popup.min.js"></script>
        <!--<< Wow Animation Js >>-->
        <script src="assets/js/wow.min.js"></script>
        <!--<< Main.js >>-->
        <script src="assets/js/main.js"></script>
        <!--<< Restin Auth.js >>-->
        <script src="assets/js/auth.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var btn = document.getElementById('returnDashboardBtn');
                var textEl = document.getElementById('returnDashboardText');
                if (window.RestinAuth) {
                    var user = window.RestinAuth.getCurrentUser();
                    if (user && user.role) {
                        btn.href = user.dashboardUrl || 'dashboard.html';
                        textEl.textContent = 'RETURN TO ' + (user.roleTitle || 'ROLE').toUpperCase() + ' DASHBOARD';
                    } else {
                        btn.href = 'login.html';
                        textEl.textContent = 'SIGN IN TO DASHBOARD';
                    }
                }
            });
        </script>
    </body>
</html>
